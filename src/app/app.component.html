<body>
  <div class="container">
    <div class="box">
      <div class="logo">TenantX</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Dashboard</a>
        <a href="#">Login</a>
      </nav>
    </div>
  
    <div class="box" style="margin: 20px 0">
      <label for="tenantId">Tenant ID:</label>
      <input id="tenantId" [(ngModel)]="tenantId" type="number" placeholder="Enter Tenant ID" />
      <button (click)="loadTenantData(tenantId)">Load Tenant</button>
    </div>
  
    <!-- Display error message if any -->
    <div class="box" *ngIf="error" style="color: red;">
      <p>{{ error }}</p>
    </div>
  
    <div class="box" *ngIf="tenant">
      <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; margin-top: 20px;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Domain</th>
            <th>Scheme Name</th>
            <th>Config Json</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>{{ tenant.id }}</td>
            <td>{{ tenant.name }}</td>
            <td>{{ tenant.domain }}</td>
            <td>{{ tenant.schemeName }}</td>
            <!-- Use the JSON pipe to display configJson properly -->
            <td>{{ tenant.configJson | json }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div class="box" style="text-align: center; margin-top: 40px;">
      &copy; 2025 TenantX. All rights reserved.
    </div>
  </div>
</body>
