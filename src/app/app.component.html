  <div class="container">
    <h1>Welcome to the Default Page</h1>
    <p>This is a simple clean starting point.</p>
  </div>
  <table border="1" cellpadding="10" cellspacing="0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Domain</th>
        <th>Theme</th>
        <th>Realtime Chat</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ tenant!.id }}</td>
        <td>{{ tenant!.name }}</td>
        <td>{{ tenant!.domain }}</td>
        <td>{{ config!.theme }}</td>
        <td>{{ config!.enableRealtimeChat ? 'Enabled' : 'Disabled' }}</td>
      </tr>
    </tbody>
  </table>
